name: Test Suite

# A LONG-LIVED BRANCH DOES NOT BELONG IN EITHER LIST WHILE ITS PR IS OPEN, and
# this branch put itself in both. The cost was measured, not theorised: every
# push produced TWO full Test Suite runs (`event=push` and
# `event=pull_request`) for the same commit, so a burst of commits queued eight
# runs where four were wanted and the checks took twice as long to settle.
#
#  - `push.branches` matches the branch being pushed TO, so listing this branch
#    added a second, redundant run of the run `pull_request` already gives.
#  - `pull_request.branches` filters on the BASE branch, not the head. This PR's
#    base is `master`, already listed — so that entry bought nothing at all. It
#    would only matter for a PR *targeting* this branch, and there are none.
#
# Removed, and the branch keeps full CI on every push through `pull_request`'s
# `synchronize`. `pu/flash-sandbox` and `pu/panes-agent` carry the same
# redundancy and are left alone: they predate this branch and are not its to
# change.
#
# `pu/**` (base-branch filter) replaced `pu/imago`: PRs into any integration
# branch get the full suite, and nothing goes dead when pu/imago merges and is
# deleted. pu/imago's own pushes were redundant with its master PR's
# `synchronize` runs, for the reason above.
on:
  push:
    branches: [main, master, develop, pu/flash-sandbox, pu/panes-agent]
  pull_request:
    branches: [main, master, develop, pu/flash-sandbox, pu/panes-agent, 'pu/**']
  workflow_dispatch:
    inputs:
      # Makes imago's Linux visual baselines on the runner and uploads them as the
      # `imago-visual-baselines` artifact, to be reviewed and committed by hand
      # (apps/e2e/tests/34-imago-visual.spec.ts). Nothing is committed from CI.
      update_visual_baselines:
        description: Regenerate imago's visual baselines (artifact only; never committed by CI)
        type: boolean
        default: false

# A newer push to the same PR makes the older run irrelevant, so cancel it:
# superseded runs queued behind each other and held CI for ~40 minutes.
# Only pull_request runs share a group (keyed on the PR number). Every push and
# manual run gets its own group (run_id), so a master run is never cancelled or
# replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # Empty on push and pull_request, which therefore always compare.
      update_visual_baselines: ${{ inputs.update_visual_baselines == true }}
