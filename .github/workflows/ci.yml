name: CI

# Reusable test + lint suite. Called by test.yml (PR/push feedback) and by
# docker-images.yml (gates the Fly deploy on green tests). Single source of truth —
# no duplicated job definitions.
on:
  workflow_call:

# Minimal permissions: read source only. No write access needed — artifact upload
# uses the Actions API (not git), which is allowed under contents: read.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagespace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Test on the Node version we ship. apps/web and apps/realtime run Node 24
      # in production (see their Dockerfiles), so the bulk of the suite runs here.
      # apps/processor is the exception: it ships on Node 22 and its Magika
      # (onnxruntime) content detection fails to load on Node 24 — so it is
      # excluded here and run separately below on its own Node 22 runtime.
      - name: Setup Node.js (24 — web/realtime runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
        run: bun run db:generate

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
        run: bun run --filter '@pagespace/db' db:migrate

      - name: Run tests with coverage (Node 24)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
        run: bunx turbo run test:coverage --filter='!@pagespace/processor'

      # apps/processor ships on Node 22 (apps/processor/Dockerfile). Magika's
      # onnxruntime native bindings fail to initialize on Node 24, so test the
      # processor on the runtime it actually deploys to.
      - name: Setup Node.js (22 — processor runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Run processor tests with coverage (Node 22)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
        run: bunx turbo run test:coverage --filter='@pagespace/processor'

      # Backfill scripts have their own vitest context (scripts/vitest.config.ts)
      # and are not part of any workspace package, so the turbo test pipeline
      # never sees them. Run the WHOLE context — the file set is already
      # declared once, by that config's `include` patterns. This step used to
      # repeat it as a hand-written file list, and the two drifted: four files
      # (including `tenant-export-columns.test.ts`, the drift guard that keeps
      # a renamed schema column from being silently dropped out of every tenant
      # migration bundle) existed and were never run here. One list, so there
      # is nothing left to keep in sync. tenant-*.test.ts need DATABASE_URL
      # pointed at this job's postgres service (they default to a
      # docker-compose.test.yml-only port otherwise); the config's singleFork
      # pool keeps them from racing each other or the earlier coverage run over
      # the same DB.
      - name: Run backfill script tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
        run: cd scripts && bunx vitest run

      # The evidence manifest cites tests as proof of the epic's user-facing guarantees.
      # This is the gate that keeps those citations honest — it fails on a cited file that
      # moved, a cited test that was renamed or skipped, and a cited test living in a suite
      # no CI job runs. Runs after the suites above so a citation and its target are checked
      # against the same tree. See docs/2.0-architecture/agent-sessions-evidence.md.
      - name: Check evidence manifest
        run: bun run scripts/check-evidence-manifest.ts

      - name: Coverage report
        if: always()
        run: node scripts/coverage-report.mjs

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          retention-days: 30

  # The epic's headline user stories — "a server dispatch renders live in an open pane",
  # "two windows both see both sides", "the pane grid converges across two devices" — are
  # proved by Playwright specs that, until this job, ran only when a human remembered to run
  # them. The specs' own headers said so ("There is no e2e job in CI, so these run locally").
  #
  # SCOPE: specs 15/16/17 only, not the whole e2e suite. These three are the epic's gate; the
  # metering and storage specs (09-14, 08) need Stripe and real S3 credentials and cost far
  # more runner time than their regression risk here justifies. Widening the list means
  # widening `E2E_SPECS` below AND the citations in the evidence manifest.
  #
  # The topology is reproduced deliberately and every piece of it is load-bearing — see the
  # comments on each step. Getting it wrong does not fail loudly; it makes the live-delivery
  # specs pass for the wrong reason.
  e2e:
    name: E2E (agent-session user stories)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagespace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pagespace_test
      # Secrets the app validates for length at boot (packages/lib/src/config/env-validation.ts).
      # Fixed test values — nothing here is a real credential.
      CSRF_SECRET: e2e-csrf-secret-at-least-32-characters-long
      ENCRYPTION_KEY: e2e-encryption-key-at-least-32-characters-long
      REALTIME_BROADCAST_SECRET: e2e-realtime-broadcast-secret-at-least-32-chars
      CRON_SECRET: e2e-cron-secret-at-least-32-characters-long
      STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder_not_a_real_secret
      SENTRY_DSN: local-dev-placeholder-not-a-real-dsn
      # The AI provider is Playwright's own mock, started by playwright.config.ts's `webServer`
      # on :4998. The app must be pointed at it at RUNTIME, so it is set for build and start.
      OPENROUTER_DEFAULT_API_KEY: sk-e2e
      OPENROUTER_BASE_URL: http://127.0.0.1:4998/api/v1
      # One origin for the browser: the proxy. The app and the seeder derive cookie domain and
      # absolute URLs from these, so they must name the proxy, not the backend port.
      WEB_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      # Server-to-server broadcast hop. Not the browser's path — this one may be cross-origin.
      INTERNAL_REALTIME_URL: http://127.0.0.1:3001
      # NEXT_PUBLIC_REALTIME_URL is deliberately UNSET. See the proxy step.
      E2E_WEB_TARGET: http://127.0.0.1:3100
      E2E_REALTIME_TARGET: http://127.0.0.1:3001
      E2E_SPECS: tests/15-chat-fixture-smoke.spec.ts tests/16-dispatch-multiplayer.spec.ts tests/17-agent-workspace-grid.spec.ts

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Node.js (24 — the web/realtime runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build --filter='@pagespace/db' --filter='@pagespace/lib'

      # Must run from the package: drizzle.config.ts resolves its migrations folder relative
      # to the package directory, so a repo-root invocation finds no migrations and silently
      # migrates nothing.
      - name: Migrate test database
        run: bun run --filter '@pagespace/db' db:migrate

      # PRODUCTION BUILD, NOT `next dev`. The app's own CSP has no `unsafe-eval` in script-src
      # (apps/web/src/middleware/security-headers.ts), and the dev bundler needs eval to
      # hydrate — so under `next dev` the page renders but never becomes interactive and every
      # spec fails in a way that looks like an app bug. `next build && next start` is the only
      # configuration these specs are meaningful in.
      - name: Build web (production)
        run: bun run build --filter=web

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Start realtime server
        run: nohup bun run start > /tmp/realtime.log 2>&1 &
        working-directory: apps/realtime
        env:
          PORT: '3001'
          LOG_LEVEL: debug

      # Web listens on 3100, NOT the origin the browser uses. The browser only ever talks to
      # the proxy on 3000.
      - name: Start web (production server)
        run: nohup bun run start --port 3100 > /tmp/web.log 2>&1 &
        working-directory: apps/web

      # THE PIECE THAT IS EASY TO GET WRONG AND FAILS SILENTLY.
      # The shipped CSP is `connect-src 'self' ws: wss:` and Socket.IO opens with an XHR
      # POLLING handshake before upgrading. Point the browser at a realtime server on another
      # origin and CSP blocks that handshake, NO socket connects, zero rooms are joined — and
      # the live-delivery specs still go green off the mount-time refetch. They would then be
      # testing nothing, permanently.
      # Production avoids this because Traefik path-routes /socket.io to realtime on the app's
      # own host (infrastructure/docker-compose.tenant.yml), which `'self'` covers. This proxy
      # is that rule: one origin on :3000, /socket.io (with upgrade) to realtime, the rest to
      # web, and NEXT_PUBLIC_REALTIME_URL left unset so the socket store falls back to
      # same-origin. Do not "simplify" this by relaxing the CSP or setting bypassCSP — both
      # stop the run testing the shipped policy.
      - name: Start same-origin proxy (/socket.io -> realtime, rest -> web)
        run: nohup bun run support/e2e-proxy.ts > /tmp/proxy.log 2>&1 &
        working-directory: apps/e2e
        env:
          E2E_PROXY_PORT: '3000'

      # Both probes go through the PROXY on purpose. The socket.io one is the important half:
      # a 200 with a session id on the polling handshake proves web, proxy and realtime are all
      # up AND that the /socket.io route really reaches realtime. Probing realtime directly on
      # :3001 would pass even with the proxy rule broken — the exact silent misconfiguration
      # this job exists to rule out. (realtime serves no health route; unknown paths 404.)
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null \
               && curl -sf "http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'; then
              echo "stack up: web + same-origin socket.io handshake"; exit 0
            fi
            sleep 2
          done
          echo "stack did not come up"; tail -50 /tmp/web.log /tmp/realtime.log /tmp/proxy.log; exit 1

      # Playwright starts the OpenRouter mock itself on :4998 via its `webServer` config.
      - name: Run agent-session e2e specs
        run: bunx playwright test $E2E_SPECS
        working-directory: apps/e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14

      # A silent socket is the failure mode that makes these specs meaningless, so surface the
      # server logs whenever the job fails: realtime at LOG_LEVEL=debug logs
      # "User joined conversation room" per room join, and zero of those means the proxy or
      # the CSP path broke rather than the feature.
      - name: Server logs (on failure)
        if: failure()
        run: tail -200 /tmp/web.log /tmp/realtime.log /tmp/proxy.log

  lint:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript check
        run: bun run typecheck

      - name: Knip (unused code gate)
        run: bun run knip:check
