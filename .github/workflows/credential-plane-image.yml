name: Credential Plane Image

# Proves apps/web/Dockerfile.credential-plane builds and the image boots, on
# every PR into master or a pu/* branch and every push to master.
# docker-images.yml's deploy job needs every build-and-push leg, so a plane
# image that first fails to build there would skip the production deploy of
# every service. Running here first turns that into a red check on the PR.
#
# Build only: no registry login, no push, no deploy. Every secret below is
# generated for this run and thrown away with the runner.
on:
  pull_request:
    branches: [master, 'pu/**']
    paths:
      - 'apps/web/Dockerfile.credential-plane'
      # Every Dockerfile shares the workspace manifest block the plane installs from.
      - 'apps/*/package.json'
      # The image runs lib's source and db's build, installed from the root lockfile.
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/credential-plane-image.yml'
  push:
    branches: [master]
    # Same inputs as pull_request above.
    paths:
      - 'apps/web/Dockerfile.credential-plane'
      - 'apps/*/package.json'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/credential-plane-image.yml'
  workflow_dispatch:

concurrency:
  group: credential-plane-image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build & boot credential plane
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile.credential-plane
          push: false
          load: true
          tags: pagespace-credential-plane:ci
          # Own scope so this never evicts docker-images.yml's cache.
          cache-from: type=gha,scope=credential-plane-image
          cache-to: type=gha,scope=credential-plane-image,mode=max

      - name: Runs as non-root and carries only lib/db production dependencies
        run: |
          uid=$(docker run --rm pagespace-credential-plane:ci id -u)
          [ "$uid" != "0" ] || { echo "plane runs as root"; exit 1; }
          # The web app's heavy dependencies must never reach the process that holds plaintext.
          if docker run --rm pagespace-credential-plane:ci sh -c 'ls node_modules/.bun | grep -E "^(next|@tensorflow\+tfjs-node|electron)@"'; then
            echo "web-only dependencies leaked into the plane image"
            exit 1
          fi
          echo "uid=$uid; no web-only dependencies"

      - name: Refuses to start unconfigured, naming variables only
        run: |
          set +e
          out=$(docker run --rm pagespace-credential-plane:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -ne 0 ] || { echo "plane started with an empty environment"; exit 1; }
          echo "$out" | grep -q "refusing to start; missing: AGENT_ACCOUNTS_PLANE_SERVICE_SECRET" || exit 1

      - name: Start Postgres
        run: |
          docker network create plane-ci
          docker run -d --name plane-ci-pg --network plane-ci \
            -e POSTGRES_USER=plane -e POSTGRES_PASSWORD=plane -e POSTGRES_DB=plane_metadata postgres:16-alpine
          for _ in $(seq 1 30); do
            docker exec plane-ci-pg pg_isready -U plane -d plane_metadata && exit 0
            sleep 2
          done
          exit 1

      - name: Migrate twice (second run must be a no-op)
        run: |
          url=postgresql://plane:plane@plane-ci-pg:5432/plane_metadata
          migrate() { docker run --rm --network plane-ci -e PLANE_METADATA_DATABASE_URL="$url" pagespace-credential-plane:ci bun run --filter @pagespace/lib credential-plane:migrate; }
          migrate | tee "$RUNNER_TEMP/first.txt"
          grep -q "credential-plane:migrate: applied 0001_init.sql" "$RUNNER_TEMP/first.txt"
          migrate | tee "$RUNNER_TEMP/second.txt"
          grep -q "credential-plane:migrate: up to date" "$RUNNER_TEMP/second.txt"

      - name: Boot with a generated secret set
        run: |
          # Throwaway values for this run only; written to a file, never echoed.
          docker run --rm --entrypoint sh pagespace-credential-plane:ci -c \
            'bun run --filter @pagespace/lib credential-plane:secrets -- /tmp/set >/dev/null && cat /tmp/set/plane.env' \
            > "$RUNNER_TEMP/plane.env"
          url=postgresql://plane:plane@plane-ci-pg:5432/plane_metadata
          docker run -d --name plane --network plane-ci -p 3011:3011 --env-file "$RUNNER_TEMP/plane.env" \
            -e INFISICAL_URL=http://infisical.invalid:8080 -e INFISICAL_ORG_ID=ci \
            -e INFISICAL_PROVISIONER_CLIENT_ID=ci -e INFISICAL_PROVISIONER_CLIENT_SECRET=ci \
            -e PLANE_METADATA_DATABASE_URL="$url" -e DATABASE_URL="$url" \
            pagespace-credential-plane:ci

      - name: /health answers; unsigned requests are refused
        run: |
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:3011/health; then
              echo
              echo "plane answered on attempt $i"
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:3011/v1/accounts/put)
              [ "$code" = "401" ] || { echo "unsigned put answered $code, expected 401"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "plane did not answer /health within 60s"
          docker logs plane
          exit 1

      - name: Container health status
        run: |
          for _ in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' plane)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done
          docker inspect --format '{{json .State.Health}}' plane
          exit 1
